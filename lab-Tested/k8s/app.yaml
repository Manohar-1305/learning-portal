---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-labs
  namespace: learning-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learning-labs
  template:
    metadata:
      labels:
        app: learning-labs
    spec:
      containers:
        - name: learning-labs
          image: learning-labs:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - secretRef:
                name: learning-labs-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: learning-labs
  namespace: learning-labs
spec:
  type: NodePort
  selector:
    app: learning-labs
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30000
