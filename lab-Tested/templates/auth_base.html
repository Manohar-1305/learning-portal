
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Learning Labs{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }
    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .auth-sub { color: #64748b; margin-bottom: 25px; }
    .auth-form { display: grid; gap: 17px; }
    .field { display: grid; gap: 7px; }
    label { font-size: 14px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }
    .auth-btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-row, .auth-switch { font-size: 14px; text-align: center; }
    a { color: #2563eb; text-decoration: none; }
    .auth-switch { margin-top: 22px; }
    .flash {
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      background: #f1f5f9;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="auth-card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
