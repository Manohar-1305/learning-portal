
{% extends "auth_base.html" %}
{% block title %}Forgot password | Learning Labs{% endblock %}
{% block content %}
<h1>Forgot your password?</h1>
<p class="auth-sub">Enter your account email to receive a verification code.</p>

<form class="auth-form" method="post" action="{{ url_for('forgot_password') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}" />

  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email"
           autocomplete="email" required autofocus />
  </div>

  <button class="auth-btn" type="submit">Send verification code</button>
</form>

<p class="auth-switch">
  Remembered it? <a href="{{ url_for('login') }}">Back to login</a>
</p>
{% endblock %}
