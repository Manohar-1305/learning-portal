
{% extends "auth_base.html" %}
{% block title %}Login | Learning Labs{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<p class="auth-sub">Log in to continue to your learning labs.</p>

<form class="auth-form" method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}" />
  <input type="hidden" name="next" value="{{ next_url }}" />

  <div class="field">
    <label for="identifier">Username or email</label>
    <input id="identifier" name="identifier" type="text"
           autocomplete="username"
           value="{{ request.form.get('identifier', '') }}"
           required autofocus />
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required />
  </div>

  <div class="auth-row">
    <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
  </div>

  <button class="auth-btn" type="submit">Login</button>
</form>

<p class="auth-switch">
  New here? <a href="{{ url_for('register') }}">Create an account</a>
</p>
{% endblock %}
