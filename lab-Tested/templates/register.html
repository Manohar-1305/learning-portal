
{% extends "auth_base.html" %}
{% block title %}Register | Learning Labs{% endblock %}
{% block content %}
<h1>Create your account</h1>
<p class="auth-sub">Sign up to start practicing in your own labs.</p>

<form class="auth-form" method="post" action="{{ url_for('register') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}" />

  <div class="field">
    <label for="username">Username (3-30 characters)</label>
    <input id="username" name="username" type="text"
           autocomplete="username" minlength="3" maxlength="30"
           value="{{ request.form.get('username', '') }}" required autofocus />
  </div>

  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email"
           autocomplete="email" value="{{ request.form.get('email', '') }}"
           required />
  </div>

  <button class="auth-btn" type="submit">Send verification code</button>
</form>

<p class="auth-switch">
  Already have an account? <a href="{{ url_for('login') }}">Login</a>
</p>
{% endblock %}
