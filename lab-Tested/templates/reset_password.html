
{% extends "auth_base.html" %}
{% block title %}Reset password | Learning Labs{% endblock %}
{% block content %}
<h1>Set a new password</h1>
<p class="auth-sub">Choose a new password (3-12 characters) for your account.</p>

<form class="auth-form" method="post"
      action="{{ url_for('reset_password', token=token) }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}" />

  <div class="field">
    <label for="password">New password</label>
    <input id="password" name="password" type="password"
           autocomplete="new-password" minlength="3" maxlength="12"
           required autofocus />
  </div>

  <div class="field">
    <label for="confirm">Confirm new password</label>
    <input id="confirm" name="confirm" type="password"
           autocomplete="new-password" minlength="3" maxlength="12"
           required />
  </div>

  <button class="auth-btn" type="submit">Update password</button>
</form>
{% endblock %}
