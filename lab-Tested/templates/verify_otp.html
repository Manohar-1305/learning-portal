
{% extends "auth_base.html" %}
{% block title %}Verify email | Learning Labs{% endblock %}
{% block content %}
<h1>Verify your email</h1>
<p class="auth-sub">Enter the six-digit code sent to your email.</p>

<form class="auth-form" method="post" action="{{ url_for('verify_otp') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}" />

  <div class="field">
    <label for="otp">Verification code</label>
    <input id="otp" name="otp" type="text" inputmode="numeric"
           pattern="[0-9]{6}" minlength="6" maxlength="6" required autofocus />
  </div>

  {% if purpose in ["register", "reset"] %}
  <div class="field">
    <label for="password">
      {% if purpose == "register" %}Create password{% else %}New password{% endif %}
    </label>
    <input id="password" name="password" type="password"
           minlength="3" maxlength="12" autocomplete="new-password" required />
  </div>

  <div class="field">
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password"
           minlength="3" maxlength="12" autocomplete="new-password" required />
  </div>
  {% endif %}

  <button class="auth-btn" type="submit">
    {% if purpose == "login" %}Verify and login
    {% elif purpose == "register" %}Verify and create account
    {% else %}Verify and update password{% endif %}
  </button>
</form>
{% endblock %}
